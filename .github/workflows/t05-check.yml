name: T05 fixed checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-t05:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:t05
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t05-test-evidence
          path: evidence/t05-test-results.json
          if-no-files-found: ignore
